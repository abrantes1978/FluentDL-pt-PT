name: FluentDL PT-PT Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package (x64)
    runs-on: windows-latest
    steps:
      - name: Check out customized PT-PT version
        uses: actions/checkout@v4
        with:
          ref: custom/pt-PT-artwork-600

      - name: Pull Git LFS assets
        uses: ./.github/actions/lfs-pull

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run core tests
        run: dotnet test FluentDL.Core.Tests/FluentDL.Core.Tests.csproj -c Release

      - name: Read package version
        shell: pwsh
        run: |
          $manifest = [xml](Get-Content -Raw FluentDL/Package.appxmanifest)
          $version = $manifest.Package.Identity.Version
          if (-not $version) { throw "Could not read the package version from Package.appxmanifest." }
          "VERSION=$version" >> $env:GITHUB_ENV
          "Package version: $version" >> $env:GITHUB_STEP_SUMMARY

      - name: Build sideload package
        working-directory: FluentDL
        shell: pwsh
        run: |
          dotnet run --file PackageSelect/BuildPackages.cs -- --version $env:VERSION --channel Sideload --architecture x64 --no-sandbox --output "$env:GITHUB_WORKSPACE/packages"

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v7
        with:
          path: packages/**/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
